<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Cliente</title>

    <link rel="stylesheet" href="css/estilo.css">

    <style>
        /* LARGURA DO FORMULÁRIO */
        form {
            width: 300px;
            margin: 0 auto;
        }

        /* ALINHAMENTO DAS CAIXAS DE ENTRADA */
        .input-group{
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* ESTILO DO BOTÃO - FUNDO AZUL #0056B3 */
        button {
            width: 100%;
            padding: 10px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #004494;
        }
    </style>
</head>
<body>

    <h1>HotelSystem</h1>

    <h2 style="color: #333333; text-align: center;">Acesso do Cliente</h2>
    
    <form action="autenticar.php" method="post">
    <div class="input-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="seuemail@gmail.com">
        <br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="digite sua senha">
    </div>
        <button type="submit">Enviar</button>
    </form>
    <p>Ainda não é cadastrado? <a href="cadastro_cliente.html">Cadastre-se aqui</a></p>

</body>
</html>
