<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Hotel</title>

    <link rel="stylesheet" href="css/estilo.css">

    <style>
        input{
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            height: 42px;
            font-size: 17px;
        }
        form{
            width: 450px;
            margin: 30px auto;
            padding: 30px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .input-estrelas{
            width: 120px;
        }
        button{
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover{
            background-color: #1b845a;
        }
        .link-voltar{
            display: block;
            margin-top: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1 style="text-align: center; color: #2c3e50;">IMPERIAL PALACE</h1>
    <br>
    <h2 style="text-align: center;">Cadastro de Hotel</h2>

    <form action="salvar_hotel.php" method="post">

        <label for="nome_hotel">Nome do Hotel:</label>
        <input type="text" id="nome_hotel" name="nome_hotel" required>

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade" required>

        <label for="estrelas">Classificação em Estrelas (1 a 5):</label>
        <input type="number" id="estrelas" name="estrelas" min="1" max="5" class="input-estrelas">
        <br>
        
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required>

        <button type="submit">ENVIAR CADASTRO</button>
    </form>

    <a href="index.html" class="link-voltar">Voltar à página principal</a>

</body>
</html>
