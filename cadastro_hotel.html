<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Hotel</title>

    <link rel="stylesheet" href="css/estilo.css">

    <style>
        input{
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 300px;
        }
        form{
            width: 320px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        button{
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover{
            background-color: #1b845a;
        }
    </style>
</head>
<body>

    <h1 style="text-align: center; color: #2c3e50;">IMPERIAL PALACE</h1>
    <h2>Cadastro de Hotel</h2>

    <form action="salvar_hotel.php" method="post">

        <label for="nome_hotel">Nome do Hotel:</label>
        <input type="text" id="nome_hotel" name="nome_hotel" required>

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade" required>

        <label for="classificacao">Classificação em Estrelas (1 a 5):</label>
        <input type="number" id="classificacao" name="classificacao" min="1" max="5">

        <button type="submit">Enviar Cadastro</button>
    </form>

    <a href="index.html">Voltar à página principal</a>

</body>
</html>
