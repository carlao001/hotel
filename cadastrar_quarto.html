<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Quarto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
        }
        .form-group {
            margin-bottom: 8px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .logout-link {
            display: inline-block;
            margin-top: 20px;
            color: #dc3545;
            text-decoration: none;
        }
        .logout-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Cadastrar Novo Quarto</h1>

    <form action="salvar_quarto.php" method="post">
        <div class="form-group">
            <label for="id_hotel">ID do Hotel</label>
            <input type="number" id="id_hotel" name="id_hotel" required>
        </div>

        <div class="form-group">
            <label for="numero_quarto">Número do Quarto</label>
            <input type="text" id="numero_quarto" name="numero_quarto" placeholder="Ex: 101, 202-A" required>
        </div>

        <div class="form-group">
            <label for="tipo_quarto">Tipo de Quarto</label>
            <input type="text" id="tipo_quarto" name="tipo_quarto" placeholder="Ex: Solteiro, Casal, Suíte Luxo" required>
        </div>

        <div class="form-group">
            <label for="preco_diaria">Preço da Diária (R$)</label>
            <input type="number" id="preco_diaria" name="preco_diaria" step="0.01" min="0" required>
        </div>

        <button type="submit">SALVAR QUARTO</button>
    </form>

    <a href="logout_hotel.php" class="logout-link">Sair / Deslogar</a>
</body>
</html>
